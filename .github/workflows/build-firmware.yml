name: Build firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/Growbox_CriticalKush_V6/**"
      - "firmware/Growbox_OTA_Service/**"
      - "platformio.ini"
      - ".github/workflows/build-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build firmware
        run: pio run -e esp32dev -e esp32dev_dry
      - name: Build OTA service
        run: pio run -d firmware/Growbox_OTA_Service -e ota_service
      - name: Collect bins
        run: |
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MAIN=GrowBox-${GITHUB_REF_NAME}.bin
          else
            MAIN=firmware.bin
          fi
          cp .pio/build/esp32dev/firmware.bin "dist/$MAIN"
          cp .pio/build/esp32dev_dry/firmware.bin "dist/${MAIN%.bin}-dry.bin"
          cp firmware/Growbox_OTA_Service/.pio/build/ota_service/firmware.bin dist/GrowBox-OTA-Service.bin
          ls -lh dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: dist/*.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GrowBox ${{ github.ref_name }}
          files: dist/*.bin
          generate_release_notes: true
