name: Build firmware
# [release] v6.5.8 Telegram UTF-8 + factory image

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/Growbox_CriticalKush_V6/**"
      - "firmware/Growbox_OTA_Service/**"
      - "platformio.ini"
      - "phone/**"
      - "docs/**"
      - ".github/workflows/build-firmware.yml"
      - "firmware/remote/version.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build firmware
        run: pio run -e esp32dev -e esp32dev_dry
      - name: Build OTA service
        run: pio run -d firmware/Growbox_OTA_Service -e ota_service
      - name: Collect bins
        run: |
          mkdir -p dist
          VERSION=$(python -c 'import json; print(json.load(open("firmware/remote/version.json"))["version"])')
          MAIN=GrowBox-v${VERSION}.bin
          cp .pio/build/esp32dev/firmware.bin "dist/$MAIN"
          cp .pio/build/esp32dev_dry/firmware.bin "dist/${MAIN%.bin}-dry.bin"
          cp firmware/Growbox_OTA_Service/.pio/build/ota_service/firmware.bin dist/GrowBox-OTA-Service.bin
          python -m pip install -U esptool
          esptool merge-bin -o "dist/GrowBox-v${VERSION}-factory-4MB.bin" --flash-mode dio --flash-freq 40m --flash-size 4MB 0x1000 .pio/build/esp32dev/bootloader.bin 0x8000 .pio/build/esp32dev/partitions.bin 0xe000 .pio/build/esp32dev/boot_app0.bin 0x10000 .pio/build/esp32dev/firmware.bin
          ls -lh dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: dist/*.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: dist
      - name: Read release version
        id: version
        run: echo "version=$(python -c 'import json; print(json.load(open("firmware/remote/version.json"))["version"])' )" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GrowBox v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          files: dist/*.bin
          generate_release_notes: true
