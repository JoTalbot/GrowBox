name: Build firmware
# [release] v6.5.8 Telegram UTF-8 + factory image

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/Growbox_CriticalKush_V6/**"
      - "firmware/Growbox_OTA_Service/**"
      - "platformio.ini"
      - "tools/**"
      - "phone/**"
      - "docs/**"
      - ".github/workflows/build-firmware.yml"
      - "firmware/remote/version.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Check Telegram buttons and relay mapping
        run: python tools/check_growbox_telegram.py
      - name: Build firmware
        run: pio run -e esp32dev -e esp32dev_dry -e esp32dev_mqtt
      - name: Build OTA service
        run: pio run -d firmware/Growbox_OTA_Service -e ota_service
      - name: Collect bins
        run: |
          mkdir -p dist
          VERSION=$(python -c 'import json; print(json.load(open("firmware/remote/release-version.json"))["version"])')
          MAIN=GrowBox-v${VERSION}.bin
          cp .pio/build/esp32dev/firmware.bin "dist/$MAIN"
          cp .pio/build/esp32dev_dry/firmware.bin "dist/${MAIN%.bin}-dry.bin"
          cp firmware/Growbox_OTA_Service/.pio/build/ota_service/firmware.bin dist/GrowBox-OTA-Service.bin
          python -m pip install -U esptool
          esptool --chip esp32 merge-bin -o "dist/GrowBox-v${VERSION}-factory-4MB.bin" --flash-mode dio --flash-freq 40m --flash-size 4MB 0x1000 .pio/build/esp32dev/bootloader.bin 0x8000 .pio/build/esp32dev/partitions.bin 0x10000 .pio/build/esp32dev/firmware.bin
          ls -lh dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: dist/*.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: dist
      - name: Read release version
        id: version
        run: echo "version=$(python -c 'import json; print(json.load(open("firmware/remote/release-version.json"))["version"])' )" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GrowBox v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          files: dist/*.bin
          generate_release_notes: true
      - name: Publish OTA manifest after release assets exist
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = 'firmware/remote/version.json';
            const version = process.env.RELEASE_VERSION;
            const releaseMeta = JSON.parse(fs.readFileSync('firmware/remote/release-version.json', 'utf8'));
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main'
            });
            const currentManifest = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            const parts = value => value.split('.').map(Number);
            const compare = (a, b) => {
              const aa = parts(a), bb = parts(b);
              for (let i = 0; i < Math.max(aa.length, bb.length); i++) {
                const diff = (aa[i] || 0) - (bb[i] || 0);
                if (diff) return diff;
              }
              return 0;
            };
            if (compare(currentManifest.version, version) >= 0) {
              core.info(`OTA manifest already at ${currentManifest.version}; no update needed.`);
              return;
            }
            const next = {
              version,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/v${version}/GrowBox-v${version}.bin`,
              notes: releaseMeta.notes
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `[release] Publish OTA manifest v${version} after release assets`,
              content: Buffer.from(JSON.stringify(next, null, 2) + '\\n').toString('base64'),
              sha: current.data.sha,
              branch: 'main'
            });
            core.info(`OTA manifest updated to ${version} after release publication.`);
