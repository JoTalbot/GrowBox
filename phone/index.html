<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0b100c">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>GrowBox пульт v7</title>
  <style>
    :root { --bg:#070a08; --card:#121a14; --line:#1d2a20; --ok:#52b788; --txt:#d8f3dc; --dim:#8aa392; --btn:#2d6a4f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100%; overflow-x:hidden; -webkit-text-size-adjust:100%; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--txt); padding:12px 12px calc(28px + env(safe-area-inset-bottom)); }
    h1 { font-size:20px; margin:4px 0 2px; color:var(--ok); }
    .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 0 10px; }
    .row { display:flex; justify-content:space-between; gap:8px; margin:5px 0; font-size:14px; align-items:center; }
    .big { font-size:22px; font-weight:800; }
    .badge { font-size:10px; font-weight:700; padding:3px 7px; border-radius:5px; background:#49111c; color:#ffb4a2; }
    .badge.on { background:#1b4332; color:#95d5b2; }
    label { display:block; font-size:12px; color:var(--dim); margin:8px 0 4px; }
    input { width:100%; background:#151d17; border:1px solid #253328; color:#fff; padding:10px; border-radius:8px; font-size:16px; }
    button { touch-action:manipulation; -webkit-tap-highlight-color:transparent; border:0; border-radius:8px; padding:10px 8px; font-weight:700; background:var(--btn); color:#fff; font-size:13px; }
    button.sec { background:#18201a; border:1px solid #253328; }
    button.warn { background:#9d0208; }
    button.sel { outline:2px solid #52b788; background:#1b4332; }
    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
    .modes { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin:4px 0 10px; }
    .modes button { background:#18201a; border:1px solid #253328; font-size:11px; padding:8px 4px; }
    .log { font-size:11px; color:var(--dim); white-space:pre-wrap; max-height:90px; overflow:auto; }
    .pill { display:inline-block; min-width:44px; text-align:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:#49111c; color:#ffb4a2; }
    .pill.on { background:#1b4332; color:#95d5b2; }
    .bar-bg { background:#18201a; border-radius:5px; height:8px; overflow:hidden; margin:2px 0 8px; }
    .bar-fill { height:100%; background:#40916c; width:0; }
    svg.spark { width:100%; height:110px; background:#080c09; border-radius:8px; margin-top:8px; }
  @media(max-width:520px){body{padding:8px 8px calc(24px + env(safe-area-inset-bottom))}.card{padding:10px}.grid,.grid2{grid-template-columns:1fr 1fr}.modes button,button{min-height:44px}.input,input{min-height:46px;font-size:16px!important}.big{font-size:24px}.row{gap:6px}}
  
/* v6.5.4 professional mobile layer */
:root{--bg:#07100b;--card:#0e1a12;--card2:#122219;--line:#203327;--ok:#68d391;--ok2:#3fbf7f;--txt:#ecf8ef;--dim:#8da999;--danger:#ff6b6b;--warn:#f6c453}
html{background:var(--bg);scroll-behavior:smooth}
body{background:radial-gradient(700px 300px at 50% -140px,rgba(104,211,145,.16),transparent 65%),var(--bg);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:8px 10px calc(78px + env(safe-area-inset-bottom));line-height:1.45}
h1{font-size:22px;letter-spacing:-.03em;margin:6px 0 3px;font-weight:850}.sub{color:var(--dim)}
.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.row{min-height:38px;border-bottom:1px solid rgba(141,169,153,.08);font-size:14px}.big{font-size:28px;letter-spacing:-.04em}
button{min-height:48px;border-radius:12px;padding:10px 12px;background:linear-gradient(180deg,var(--ok2),#2f9e68);color:#061109;font-size:14px;font-weight:800}
button.sec{background:#14231a;border:1px solid #294333;color:var(--txt)}button.warn{background:#8e2f35}
button.sel{outline:2px solid var(--ok);outline-offset:1px;background:#1b4332}
.grid,.grid2,.modes{gap:8px}.modes button{background:#14231a;border:1px solid #294333;color:var(--txt);min-height:44px}
input{min-height:48px;border-radius:12px;background:#0b1710;border-color:#294333}
.badge,.pill{border-radius:999px!important;padding:5px 9px!important;font-weight:800}
.bar-bg{height:9px;border-radius:99px}.bar-fill{border-radius:99px;background:linear-gradient(90deg,#3fbf7f,#8ee3b0)}
.card:first-of-type{border-color:rgba(104,211,145,.25)}
@media(max-width:520px){.grid,.grid2{grid-template-columns:1fr 1fr}.modes{grid-template-columns:repeat(3,1fr)}.modes button{font-size:12px;padding:8px 4px}.card{padding:13px}.row{gap:7px}.big{font-size:26px}}
@media(max-width:380px){.grid,.grid2{grid-template-columns:1fr}.modes button{font-size:11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
  <h1>🌿 GrowBox пульт v7</h1>
  <div class="sub">Почва, день, график · живой ntfy</div>

  <div class="card">
    <div class="row"><span>Поток</span><span id="link" class="badge">подключение…</span></div>
    <div class="row"><span>Сводка</span><b id="summary" style="text-align:right;font-size:12px">—</b></div>
    <div class="row"><span>Обновлено</span><b id="ago">—</b></div>
    <div class="row"><span>Прошивка</span><b id="fw">—</b></div>
    <div class="row"><span>Стадия / день</span><b id="stage">—</b></div>
    <div class="row"><span>Воздух</span><span class="big" id="temp">—</span></div>
    <div class="row"><span>RH / VPD</span><b id="hum">—</b></div>
    <div class="row"><span>IP</span><b id="ip">—</b></div>
    <div class="row">
      <span>Свет</span><span id="pLight" class="pill">—</span>
    </div>
    <div class="row"><span>Вытяжка</span><span id="pExh" class="pill">—</span></div>
    <div class="row"><span>Обогрев</span><span id="pHeat" class="pill">—</span></div>
    <div class="row"><span>Обдув</span><span id="pFan" class="pill">—</span></div>
    <div class="grid2">
      <button class="sec" onclick="cmd('ping')">📡 Ping</button>
      <button class="sec" onclick="cmd('status')">🔄 Запросить сейчас</button>
    </div>
  </div>

  <div class="card">
    <b>Стадия</b>
    <div class="grid">
      <button data-stage="veg" onclick="cmd('stage','veg')">🌱 Вега</button>
      <button data-stage="bloom" onclick="cmd('stage','bloom')">🌸 Цвет</button>
      <button data-stage="dry" onclick="cmd('stage','dry')">🍂 Сушка</button>
    </div>
  </div>

  <div class="card">
    <b>Полив</b>
    <div class="grid">
      <button onclick="if(confirm('Полить горшок 1?'))cmd('water','0')">💧 #1</button>
      <button onclick="if(confirm('Полить горшок 2?'))cmd('water','1')">💧 #2</button>
      <button onclick="if(confirm('Полить горшок 3?'))cmd('water','2')">💧 #3</button>
    </div>
  </div>

  <div class="card">
    <b>Реле</b>
    <div>Свет</div>
    <div class="modes" id="mdLight">
      <button data-m="auto" onclick="cmd('mode','light:auto')">Авто</button>
      <button data-m="on" onclick="cmd('mode','light:on')">Вкл</button>
      <button data-m="off" onclick="cmd('mode','light:off')">Выкл</button>
    </div>
    <div>Вытяжка</div>
    <div class="modes" id="mdExh">
      <button data-m="auto" onclick="cmd('mode','exhaust:auto')">Авто</button>
      <button data-m="on" onclick="cmd('mode','exhaust:on')">Вкл</button>
      <button data-m="off" onclick="cmd('mode','exhaust:off')">Выкл</button>
    </div>
    <div>Обогрев</div>
    <div class="modes" id="mdHeat">
      <button data-m="auto" onclick="cmd('mode','heater:auto')">Авто</button>
      <button data-m="on" onclick="cmd('mode','heater:on')">Вкл</button>
      <button data-m="off" onclick="cmd('mode','heater:off')">Выкл</button>
    </div>
    <div>Обдув</div>
    <div class="modes" id="mdFan">
      <button data-m="auto" onclick="cmd('mode','fan:auto')">Авто</button>
      <button data-m="on" onclick="cmd('mode','fan:on')">Вкл</button>
      <button data-m="off" onclick="cmd('mode','fan:off')">Выкл</button>
    </div>
    <div class="grid2">
      <button onclick="cmd('auto')">Все в авто</button>
      <button class="warn" onclick="if(confirm('Ребут коробки?'))cmd('reboot')">Ребут</button>
    </div>
  </div>

  <div class="card">
    <b>Секрет канала</b>
    <p class="sub" style="margin:6px 0">Топик и ключ с дашборда коробки. Только на этом телефоне.</p>
    <label>ntfy-топик</label>
    <input id="topic" autocomplete="off" spellcheck="false">
    <label>Ключ команд</label>
    <input id="key" autocomplete="off" spellcheck="false">
    <div class="grid2">
      <button onclick="saveCfg()">💾 Сохранить</button>
      <button class="sec" onclick="startLive(true)">Переподключить</button>
    </div>
    <div class="log" id="log"></div>
  </div>

<script>
const $ = id => document.getElementById(id);
function setTxt(id, v){ const el = $(id); if (el) el.textContent = v; }
let busy = false, lastSent = '', lastAt = 0, lastJson = null, lastTs = 0, es = null, pollTimer = null;

function log(s){
  const el = $('log');
  el.textContent = new Date().toLocaleTimeString() + ' ' + s + '\n' + el.textContent;
}

function loadCfg(){
  $('topic').value = localStorage.getItem('gb_topic') || '';
  $('key').value = localStorage.getItem('gb_key') || '';
}
function saveCfg(){
  localStorage.setItem('gb_topic', $('topic').value.trim());
  localStorage.setItem('gb_key', $('key').value.trim());
  log('сохранено');
  startLive(true);
}
function cfg(){
  const topic = ($('topic').value || localStorage.getItem('gb_topic') || '').trim();
  const key = ($('key').value || localStorage.getItem('gb_key') || '').trim();
  if (topic.length < 5) return null;
  return { topic, key };
}

function pill(id, on){
  const el = $(id);
  if (!el) return;
  el.className = 'pill' + (on ? ' on' : '');
  el.textContent = on ? 'ВКЛ' : 'ВЫКЛ';
}
function markModes(id, mode){
  document.querySelectorAll('#' + id + ' button').forEach(b => {
    b.classList.toggle('sel', mode && b.dataset.m === mode);
  });
}
function paint(j){
  lastJson = j;
  lastTs = Date.now();
  $('link').textContent = 'онлайн';
  $('link').className = 'badge on';
  const bit = (name, on, mode) => {
    const st = on ? 'вкл' : 'выкл';
    if (mode === 'on') return name + ' РУЧН вкл';
    if (mode === 'off') return name + ' РУЧН выкл';
    return name + ' ' + st;
  };
  $('summary').textContent = [
    bit('свет', !!Number(j.light), j.mLight),
    bit('вытяжка', !!Number(j.exhaust), j.mExh),
    bit('обдув', !!Number(j.fan), j.mFan)
  ].join(' · ');
  $('fw').textContent = 'v' + (j.fw || '—');
  $('stage').textContent = (j.stage || '—') + ' / день ' + (j.day ?? '—');
  const t = Number(j.temp);
  setTxt('temp', (isFinite(t) && t > -40) ? (t.toFixed(1) + ' °C') : 'нет DHT');
  const h = Number(j.hum), v = Number(j.vpd);
  setTxt('hum', (isFinite(h) && h >= 0) ? (h.toFixed(0) + '% / ' + v.toFixed(2) + ' kPa') : '—');
  setTxt('ip', j.ip || '—');
  pill('pLight', !!Number(j.light));
  pill('pExh', !!Number(j.exhaust));
  pill('pHeat', !!Number(j.heater));
  pill('pFan', !!Number(j.fan));
  if (j.mLight) markModes('mdLight', j.mLight);
  else markModes('mdLight', Number(j.light) ? 'on' : 'off');
  if (j.mExh) markModes('mdExh', j.mExh);
  if (j.mHeat) markModes('mdHeat', j.mHeat);
  if (j.mFan) markModes('mdFan', j.mFan);
  document.querySelectorAll('[data-stage]').forEach(b => {
    b.classList.toggle('sel', b.dataset.stage === j.stage);
  });
  const wt = Number(j.wTemp);
  setTxt('wTemp', (isFinite(wt) && wt > -40) ? (wt.toFixed(1) + ' °C') : 'нет DS18');
  [['1','s1Ok','soil1'],['2','s2Ok','soil2'],['3','s3Ok','soil3']].forEach(([n,ok,key]) => {
    const on = Number(j[ok]) === 1 || (j[ok] === undefined && j[key] !== undefined);
    const v = Number(j[key]);
    setTxt('s'+n+'t', on && isFinite(v) ? (v + '%') : (j[key]===undefined ? 'нужна 6.3.4' : 'ОТКЛ'));
    const bar = $('s'+n+'b');
    if (bar) bar.style.width = (on && isFinite(v) ? v : 0) + '%';
  });
  pushHist(j);
  drawSpark();
  tickAgo();
}

function loadHist(){
  try { return JSON.parse(localStorage.getItem('gb_hist') || '[]'); } catch { return []; }
}
function pushHist(j){
  const hist = loadHist();
  const pt = { ts: Date.now(), s1: Number(j.soil1)||0, t: Number(j.temp), light: Number(j.light)||0 };
  if (hist.length && Date.now() - hist[hist.length-1].ts < 20000) {
    hist[hist.length-1] = pt;
  } else hist.push(pt);
  while (hist.length > 96) hist.shift();
  localStorage.setItem('gb_hist', JSON.stringify(hist));
}
function drawSpark(){
  const svg = $('spark'); if (!svg) return;
  const hist = loadHist();
  if (hist.length < 2) {
    svg.innerHTML = '<text x="70" y="58" fill="#666" font-size="11">Накопление точек…</text>';
    return;
  }
  const w=300,h=110,p=10;
  const ys = hist.map(x => x.s1);
  const line = (arr, col) => {
    const pts = arr.map((v,i) => {
      const x = p + (i/(arr.length-1))*(w-2*p);
      const y = h-p - (Math.max(0,Math.min(100,v))/100)*(h-2*p);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return '<polyline fill="none" stroke="'+col+'" stroke-width="1.6" points="'+pts+'"/>';
  };
  svg.innerHTML = '<line x1="10" y1="100" x2="290" y2="100" stroke="#1a241c"/>' + line(ys,'#52b788');
}

function tickAgo(){
  if (!lastTs) { $('ago').textContent = '—'; return; }
  const s = Math.round((Date.now() - lastTs) / 1000);
  $('ago').textContent = s < 5 ? 'только что' : (s < 60 ? s + ' сек назад' : Math.floor(s/60) + ' мин назад');
}
setInterval(tickAgo, 1000);

function applyMsg(m){
  if (!m || m.event !== 'message') return;
  if (m.title !== 'status') return;
  try { paint(JSON.parse(m.message)); } catch {}
}

async function pollOnce(){
  const x = cfg(); if (!x) return;
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(x.topic) + '/json?poll=1&since=2h');
    const raw = await r.text();
    let last = null;
    for (const line of raw.split('\n')) {
      if (!line.trim()) continue;
      try {
        const m = JSON.parse(line);
        if (m.event === 'message' && m.title === 'status') last = m;
      } catch {}
    }
    if (last) applyMsg(last);
  } catch (e) { log('опрос: ' + e.message); }
}

function startLive(reset){
  const x = cfg();
  if (!x) { $('link').textContent = 'нет топика'; return; }
  if (es) { try { es.close(); } catch {} es = null; }
  if (pollTimer) clearInterval(pollTimer);
  pollOnce();
  pollTimer = setInterval(pollOnce, 10000);
  try {
    es = new EventSource('https://ntfy.sh/' + encodeURIComponent(x.topic) + '/sse');
    es.onopen = () => { $('link').textContent = 'поток'; $('link').className = 'badge on'; };
    es.onerror = () => { $('link').textContent = 'polling'; $('link').className = 'badge'; try { es.close(); } catch {} es = null; log('SSE недоступен, polling работает'); };
    es.onmessage = ev => {
      try { applyMsg(JSON.parse(ev.data)); } catch {}
    };
  } catch (e) { log('SSE недоступен, polling работает: ' + e.message); }
  if (reset) log('поток включён');
}

async function cmd(c, arg){
  const x = cfg();
  if (!x) { alert('Впиши топик и сохрани'); return; }
  const parts = [c];
  if (arg !== undefined && arg !== '') parts.push(String(arg));
  if (x.key) parts.push(x.key);
  const body = parts.join(' ');
  if (busy) { log('подожди…'); return; }
  if (body === lastSent && Date.now() - lastAt < 2000) { log('повтор пропущен'); return; }
  busy = true; lastSent = body; lastAt = Date.now();
  if (c === 'mode' && String(arg).includes(':')) {
    const [dev, mode] = String(arg).split(':');
    const map = { light:'mdLight', exhaust:'mdExh', heater:'mdHeat', fan:'mdFan' };
    if (map[dev]) markModes(map[dev], mode);
  }
  log('→ ' + c + (arg ? ' ' + arg : ''));
  try {
    const r = await fetch('https://ntfy.sh/', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ topic:x.topic, message:body, title:'cmd', tags:['robot'] })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (e) { log('ошибка: ' + e.message); }
  finally { setTimeout(() => { busy = false; }, 1200); }
}

loadCfg();
startLive(false);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollOnce(); });
window.addEventListener("online", () => startLive(false));
</script>
</body>
</html>
